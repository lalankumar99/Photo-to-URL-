<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Photo Gallery</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      color: #38bdf8;
    }

    .search-box {
      max-width: 450px;
      margin: 0 auto;
    }

    .search-box input {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(30, 41, 59, 0.7);
      color: #fff;
      font-size: 1rem;
      outline: none;
      backdrop-filter: blur(8px);
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      overflow: hidden;
      backdrop-filter: blur(10px);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
    }

    .img-wrapper {
      width: 100%;
      height: 200px;
      overflow: hidden;
      cursor: pointer;
      background: #1e293b;
    }

    .img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .img-wrapper:hover img {
      transform: scale(1.05);
    }

    .card-body {
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .copy-btn {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s ease;
    }

    .copy-btn:hover {
      background: #0369a1;
    }

    .copy-btn.copied {
      background: #16a34a;
    }

    /* Lightbox Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 1rem;
    }

    .modal.active {
      display: flex;
    }

    .modal img {
      max-width: 90%;
      max-height: 85vh;
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.7);
    }

    .modal-close {
      position: absolute;
      top: 1.5rem;
      right: 2rem;
      font-size: 2rem;
      color: #fff;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>Media Assets Gallery</h1>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search images by name...">
    </div>
  </header>

  <main class="gallery-grid" id="gallery"></main>

  <div class="modal" id="lightboxModal" onclick="closeLightbox()">
    <span class="modal-close">&times;</span>
    <img id="modalImg" src="" alt="Preview">
  </div>

  <script>
    // ADD YOUR GITHUB IMAGE URLS HERE
    const images = [
      {
        id: 1,
        title: "Sample 1",
        url: "image1.png"
      },
      {
        id: 2,
        title: "Sample 2",
        url: "image2.png"
      },
     {
        id: 3,
        title: "Sample 3",
        url: "image3.png"
      },
     {
        id: 4,
        title: "Sample 4",
        url: "image4.png"
      } 
    ];

    const gallery = document.getElementById('gallery');
    const searchInput = document.getElementById('searchInput');
    const modal = document.getElementById('lightboxModal');
    const modalImg = document.getElementById('modalImg');

    function renderGallery(items) {
      gallery.innerHTML = '';
      if (!items.length) {
        gallery.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #94a3b8;">No images found.</p>';
        return;
      }

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="img-wrapper" onclick="openLightbox('${item.url}')">
            <img src="${item.url}" alt="${item.title}" loading="lazy">
          </div>
          <div class="card-body">
            <span class="card-title" title="${item.title}">${item.title}</span>
            <button class="copy-btn" onclick="copyUrl('${item.url}', this)">Copy URL</button>
          </div>
        `;
        gallery.appendChild(card);
      });
    }

    function copyUrl(url, btn) {
      navigator.clipboard.writeText(url).then(() => {
        const originalText = btn.textContent;
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = originalText;
          btn.classList.remove('copied');
        }, 1500);
      });
    }

    function openLightbox(url) {
      modalImg.src = url;
      modal.classList.add('active');
    }

    function closeLightbox() {
      modal.classList.remove('active');
    }

    searchInput.addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      const filtered = images.filter(img => img.title.toLowerCase().includes(term));
      renderGallery(filtered);
    });

    renderGallery(images);
  </script>
</body>
</html>
