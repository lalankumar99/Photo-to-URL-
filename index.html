<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo to URL Generator</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    .card { background: #1e293b; padding: 30px; border-radius: 16px; width: 100%; max-width: 480px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; }
    h2 { margin-bottom: 20px; font-weight: 600; }
    .drop-zone { border: 2px dashed #38bdf8; border-radius: 12px; padding: 24px; cursor: pointer; transition: 0.3s; background: #0f172a80; }
    .drop-zone:hover { background: #38bdf815; }
    input[type="file"] { display: none; }
    img { max-width: 100%; max-height: 220px; border-radius: 8px; margin-top: 15px; display: block; margin-left: auto; margin-right: auto; object-fit: cover; }
    .output-box { margin-top: 20px; display: flex; gap: 8px; }
    input[type="text"] { flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #38bdf8; font-size: 13px; outline: none; }
    button { padding: 10px 18px; border: none; border-radius: 8px; background: #38bdf8; color: #0f172a; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #0284c7; color: #fff; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Photo to URL Generator</h2>
    
    <label class="drop-zone" for="fileInput">
      <span>Click to Upload or Drag Photo</span>
      <input type="file" id="fileInput" accept="image/*">
    </label>

    <img id="preview" src="23630-removebg-preview.png" alt="Demo Preview">

    <div class="output-box">
      <input type="text" id="urlOutput" readonly value="https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=500">
      <button onclick="copyUrl()">Copy</button>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const urlOutput = document.getElementById('urlOutput');

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          const base64Url = event.target.result;
          preview.src = base64Url;
          urlOutput.value = base64Url;
        };
        reader.readAsDataURL(file);
      }
    });

    function copyUrl() {
      urlOutput.select();
      navigator.clipboard.writeText(urlOutput.value);
      alert('URL copied to clipboard!');
    }
  </script>
</body>
</html>
